name: Share workflow feedback
description: Tell us which month-end task FinCompiler should make faster or safer.
title: "[Workflow] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow, not confidential company data. Generic system names and anonymized field names are enough.
  - type: textarea
    id: job
    attributes:
      label: What finance task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Which source exports are involved?
      placeholder: Sales detail CSV, GL trial balance XLSX, monthly budget XLSX
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: How long does the task take today?
      placeholder: About 3 hours each month
  - type: textarea
    id: blocker
    attributes:
      label: Where did FinCompiler help or block you?
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: What evidence would you need to trust the result?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include confidential or personal data.
          required: true
